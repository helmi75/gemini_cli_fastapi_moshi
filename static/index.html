<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant (Moshi Style)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 600px; margin-top: 50px; }
        .status-dot { height: 10px; width: 10px; background-color: #bbb; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .status-connected { background-color: #4caf50; }
        #visualizer { width: 100%; height: 150px; background: #1e1e1e; border-radius: 8px; margin-bottom: 20px; }
        .chat-box { height: 300px; overflow-y: auto; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .msg { margin-bottom: 10px; }
        .user-msg { color: #81d4fa; }
        .ai-msg { color: #a5d6a7; }
        .btn-mic { width: 80px; height: 80px; border-radius: 50%; font-size: 24px; }
    </style>
</head>
<body>
    <div class="container text-center">
        <h2 class="mb-4">Real-Time Voice Assistant</h2>
        
        <div class="mb-3">
            <span id="statusDot" class="status-dot"></span>
            <span id="statusText">Disconnected</span>
        </div>

        <canvas id="visualizer"></canvas>

        <div class="chat-box text-start mb-4" id="chatBox">
            <!-- Chat history here -->
        </div>

        <div class="controls">
            <button id="recordBtn" class="btn btn-primary btn-mic">
                🎤
            </button>
            <p class="mt-2" id="hintText">Maintenez pour parler</p>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
